<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7d4f" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16231b" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>KantinGo FEB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9f1ed;--sf:#fff;--tx:#1b2a21;--mu:#6b7f73;--pr:#2f7d4f;--pr2:#256b43;--ls:#d8ecdc;--ls2:#eaf5ec;--bd:#dce8e1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1712;--sf:#16231b;--tx:#e5f1ea;--mu:#9bb3a5;--pr:#4cb27b;--pr2:#3f9b69;--ls:#1e3a2a;--ls2:#1a2e22;--bd:#2a4636}}
:root[data-theme="dark"]{--bg:#0e1712;--sf:#16231b;--tx:#e5f1ea;--mu:#9bb3a5;--pr:#4cb27b;--pr2:#3f9b69;--ls:#1e3a2a;--ls2:#1a2e22;--bd:#2a4636}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,"Segoe UI",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}svg{display:block}
:focus-visible{outline:3px solid #e9a23b;outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:14px}
.panel{background:var(--sf);border:1px solid var(--bd);border-radius:14px;overflow:hidden;box-shadow:0 4px 18px rgba(30,70,45,.07)}
.top{display:flex;align-items:center;gap:26px;padding:12px 22px;border-bottom:1px solid var(--bd);background:var(--sf)}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:1.25rem;background:none;border:0;padding:0}
.logo i{width:32px;height:32px;border-radius:50%;background:var(--pr2);display:grid;place-items:center}
.logo svg{width:18px;height:18px}
.tabs{display:flex;gap:6px;flex:1}
.tabs button{background:none;border:0;padding:9px 12px;font-size:.82rem;color:var(--mu);border-bottom:2px solid transparent;margin-bottom:-13px}
.tabs button.on{color:var(--pr2);border-color:var(--pr);font-weight:600}
.ic{display:flex;align-items:center;gap:14px;color:var(--mu)}
.ic button{background:none;border:0;position:relative;padding:2px;color:var(--mu)}
.ic svg{width:19px;height:19px}.ic b{position:absolute;top:-6px;right:-8px;background:var(--pr);color:#fff;font-size:.65rem;border-radius:9px;padding:0 5px}
.av{width:28px;height:28px;border-radius:50%;background:#c58f62;color:#fff;display:grid;place-items:center;font-size:.8rem;font-weight:700}
.home{display:grid;grid-template-columns:36% 1fr;min-height:560px}
.hl{background:var(--ls);padding:34px 26px 24px;display:flex;flex-direction:column;gap:14px}
.hl h1{font-size:1.95rem;line-height:1.2;font-weight:500;margin:0}
.hl p{margin:0;font-size:.85rem}
.sr{display:flex;background:var(--sf);border-radius:9px;border:1px solid var(--bd);overflow:hidden}
.sr input{flex:1;border:0;padding:10px 12px;font:inherit;font-size:.85rem;background:none;color:var(--tx);min-width:0}
.sr button{width:40px;border:0;background:var(--pr2);color:#fff}
.sr svg{width:16px;height:16px;margin:auto}
.tiles{margin-top:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--ls2);border-radius:12px;padding:12px 8px}
.tiles div{text-align:center;font-size:.68rem;line-height:1.25;display:grid;gap:6px;justify-items:center}
.tiles svg,.sb svg,.rows svg{width:24px;height:24px;stroke:var(--pr2);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hr{padding:22px 20px}
h3{font-size:1.05rem;margin:0 0 12px}.hr h3~h3{margin-top:22px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.lc,.mc{border:1px solid var(--bd);border-radius:10px;padding:7px;background:var(--sf);display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.lc .pic{background:var(--ls);border-radius:8px;height:92px;padding:6px}.lc .pic svg{width:100%;height:100%}
.lc b,.mc b{font-size:.88rem}.lc>b{text-align:center}
.ob{border:1px solid var(--pr);background:var(--sf);color:var(--pr2);border-radius:6px;padding:4px;font-size:.8rem;font-weight:600;width:100%}
.ob:hover{background:var(--ls)}
.gb{border:0;background:var(--pr2);color:#fff;border-radius:6px;padding:7px;font-size:.82rem;font-weight:600;width:100%}.gb:hover{background:var(--pr)}.gb:disabled{opacity:.5}
.mc{align-items:center;text-align:center;cursor:pointer}
.mc.sel{border-color:var(--pr);box-shadow:0 0 0 2px var(--ls)}
.plate img,.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.plate{position:relative;overflow:hidden;width:52px;height:52px;border-radius:50%;background:var(--ls);display:grid;place-items:center;font-size:1.7rem;border:3px solid var(--sf);box-shadow:0 0 0 1px var(--bd)}
.mc small{color:var(--mu);font-size:.78rem}
.lp{display:grid;grid-template-columns:200px 1fr;gap:20px;padding:22px}
.sb{display:grid;gap:7px;align-content:start}
.sb button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:10px 12px;border-radius:8px;font-size:.85rem;text-align:left}
.sb button.on{background:var(--pr2);color:#fff;font-weight:600}
.sb button:not(.on){border:1px solid var(--bd)}.sb button svg{width:18px;height:18px;stroke:currentColor}
.sb span{flex:1}.lp h2{font-size:1.25rem;margin:0}.lp .sub{color:var(--mu);font-size:.8rem;margin:2px 0 12px}
.lp .sr{margin-bottom:14px}.lp .lc .pic{height:110px}
.dt{padding:18px 22px;display:grid;grid-template-columns:1.65fr 1fr;gap:20px}
.back{background:none;border:0;color:var(--pr2);font-size:.8rem;padding:0;margin-bottom:10px}
.hd{display:flex;gap:14px;align-items:center;border:1px solid var(--bd);border-radius:12px;padding:10px}
.hd .ph{position:relative;overflow:hidden;width:150px;height:84px;border-radius:9px;background:linear-gradient(135deg,#f3d9b0,#e6a96b);display:grid;place-items:center;font-size:3rem;flex:none}
.hd h2{margin:0;font-size:1.3rem}.hd p{margin:0;font-size:.78rem;color:var(--mu)}
.bd{background:var(--pr2);color:#fff;border-radius:5px;font-size:.7rem;padding:2px 8px;font-weight:600}
.tb{display:flex;gap:18px;border-bottom:1px solid var(--bd);margin:12px 0}
.tb button{background:none;border:0;border-bottom:2px solid transparent;padding:6px 2px;font-size:.85rem;color:var(--mu)}
.tb button.on{color:var(--pr2);border-color:var(--pr);font-weight:600}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pills button{border:0;background:var(--ls);border-radius:18px;padding:5px 16px;font-size:.78rem}
.pills button.on{background:var(--pr2);color:#fff;font-weight:600}
.box{border:1px solid var(--bd);border-radius:12px;padding:16px;background:var(--sf)}
.big{display:flex;gap:14px;align-items:center}.big .plate{width:84px;height:84px;font-size:2.8rem}
.big h2{margin:0;font-size:1.15rem}.pr{color:var(--pr2);font-weight:700;font-size:1.05rem}
.desc{color:var(--mu);font-size:.8rem;margin:12px 0}
.q{display:flex;justify-content:center;align-items:center;gap:0;margin:10px auto;width:fit-content;border:1px solid var(--bd);border-radius:8px}
.q button{width:36px;height:30px;border:0;background:none;font-size:1.1rem}.q span{width:46px;text-align:center;border-inline:1px solid var(--bd);line-height:30px}
.rows{display:grid;gap:12px;font-size:.8rem;margin-top:14px}
.rows div{display:flex;gap:10px;align-items:center}.rows svg{width:18px;height:18px;flex:none}
.cr{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;padding:20px 22px}
.it{display:flex;align-items:center;gap:12px;border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.it .t{width:48px;height:42px;background:var(--ls);border-radius:7px;padding:3px;flex:none}.it .t svg{width:100%;height:100%}
.it .n{flex:1;font-size:.82rem;line-height:1.3}.it .n small{color:var(--mu);display:block}
.it .q{margin:0}.it .q button{width:26px;height:26px}.it .q span{width:32px;line-height:26px;font-size:.85rem}
.del{border:0;background:none;color:var(--mu);font-size:1rem}
.lnk{background:none;border:0;color:var(--pr2);font-size:.82rem;padding:4px 0;font-weight:500}
.po{display:flex;gap:10px;align-items:center;border:1px solid var(--bd);border-radius:9px;padding:9px 12px;margin-top:8px;font-size:.82rem;cursor:pointer;background:var(--sf);width:100%;text-align:left}
.po small{color:var(--mu);display:block;font-size:.72rem}.po span{flex:1}
.ck{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--bd);display:grid;place-items:center;font-size:.7rem;color:#fff}.po.on .ck{background:var(--pr2);border-color:var(--pr2)}
.po.on{border-color:var(--pr)}
.ln{display:flex;justify-content:space-between;font-size:.8rem;padding:4px 0;gap:8px}.ln b{font-weight:600}
.tot{border-top:1px solid var(--bd);margin:10px 0 14px;padding-top:12px;font-weight:700;font-size:.95rem}
.nt{display:flex;gap:10px;font-size:.72rem;color:var(--mu);margin-top:14px;background:var(--ls2);border-radius:8px;padding:10px}
.st{display:grid;grid-template-columns:.8fr 1.6fr 1fr;gap:16px;padding:20px 22px}
.gc{background:var(--ls);border-radius:12px;padding:24px 16px;text-align:center;display:grid;gap:4px;align-content:start;justify-items:center}
.gc .ok{width:50px;height:50px;border-radius:50%;background:var(--pr2);color:#fff;display:grid;place-items:center;font-size:1.5rem;margin-bottom:6px}
.gc h2{margin:0 0 14px;font-size:1.1rem}.gc small{color:var(--mu)}.gc strong{font-size:1.3rem;margin-bottom:10px}
.prog{display:flex;margin:16px 0 20px;position:relative}
.prog:before{content:"";position:absolute;left:12%;right:12%;top:8px;height:3px;background:var(--bd)}
.prog div{flex:1;text-align:center;font-size:.7rem;color:var(--mu);position:relative}
.prog i{display:grid;place-items:center;width:19px;height:19px;border-radius:50%;background:var(--bd);margin:0 auto 6px;color:#fff;font-size:.6rem;font-style:normal}
.prog .d{color:var(--tx)}.prog .d i{background:var(--pr2)}
.dot{width:10px;height:10px;border-radius:50%;background:#b8733b;flex:none;margin-right:8px;display:inline-block}
.emp{text-align:center;padding:60px 20px;color:var(--mu)}.emp p{margin:0 0 14px}.emp .gb{width:auto;padding:9px 20px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}
.mode{border:1px solid var(--pr);background:var(--sf);color:var(--pr2);border-radius:16px;padding:4px 12px;font-size:.75rem;font-weight:600;white-space:nowrap}.mode.on{background:var(--pr2);color:#fff}
.sh{padding:20px 22px}.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar select{border:1px solid var(--bd);border-radius:8px;padding:6px 10px;background:var(--sf);color:var(--tx);font:inherit;font-size:.85rem}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.tag{font-size:.7rem;font-weight:600;border-radius:5px;padding:2px 8px;background:var(--ls);color:var(--pr2);white-space:nowrap}.tag.red{background:#f6dcd6;color:#8c2f1c}.tag.amb{background:#fbeccd;color:#7a5410}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--pr2);color:#fff;padding:9px 18px;border-radius:20px;font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .2s}#toast.on{opacity:1}
@media(max-width:900px){.home,.dt,.cr,.st{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,1fr)}.lp{grid-template-columns:1fr}.sb{display:flex;overflow-x:auto}.sb button{white-space:nowrap}.sb .ch{display:none}.top{gap:10px;padding:10px 12px}.logo span{display:none}.tabs button{padding:8px 6px}.tiles{grid-template-columns:repeat(2,1fr)}.hd .ph{width:90px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Optimasi ponsel & desktop ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,select,input,.mc{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
.tabs{overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap}
.row{flex-wrap:wrap}
.ic{gap:10px}

/* Desktop: efek hover hanya untuk perangkat dengan mouse */
@media(hover:hover){
.lc,.mc{transition:transform .15s,box-shadow .15s}
.lc:hover,.mc:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(30,70,45,.12)}
.tabs button:hover{color:var(--pr2)}.pills button:hover{background:var(--ls2)}
.sb button:not(.on):hover{background:var(--ls2)}
}
@media(min-width:1280px){.wrap{max-width:1280px;padding:20px}}
@media(min-width:901px) and (max-width:1100px){.st{grid-template-columns:1fr 1.6fr}.st>div:last-child{grid-column:1/-1}.g4{grid-template-columns:repeat(3,1fr)}}

/* Layar sentuh: target tap minimal ±40px */
@media(pointer:coarse){
.ic{gap:4px}
.ic button{min-width:40px;min-height:40px;display:grid;place-items:center}
.ic b{top:2px;right:0}
.q button{width:42px;height:40px}.q span{line-height:40px}
.it .q button{width:34px;height:34px}.it .q span{line-height:34px}
.ob,.gb,.mode,.bar select,.ic select{min-height:40px}
.pills button{padding:9px 16px}.tb button{padding:12px 2px}
.back,.lnk{padding:10px 0}.del{padding:10px}.sb button{min-height:44px}.po{padding:12px}
}

/* Ponsel: bottom navigation + header menempel */
@media(max-width:700px){
body{padding-bottom:64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:40}
.wrap{padding:0}
.panel{border-radius:0;border-width:0;box-shadow:none;overflow:visible;min-height:100vh}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:35}
.top .ic{margin-left:auto}
.ic select{max-width:130px;font-size:.72rem}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:35;gap:0;background:var(--sf);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -4px 14px rgba(0,0,0,.08)}
.tabs button{flex:1;margin:0;min-height:56px;padding:10px 4px;font-size:.74rem;border-bottom:0;border-top:3px solid transparent}
.tabs button.on{border-top-color:var(--pr)}
.home{min-height:0}.hl{padding:22px 16px}.hl h1{font-size:1.45rem}
.hr,.lp,.dt,.cr,.st,.sh{padding:14px}
.sr input,.bar select,.ic select{font-size:16px}.sr input{padding:12px}.sr button{width:48px}
.g4{gap:10px}.lc .pic{height:84px}
.hd{flex-wrap:wrap}.hd .ph{width:72px;height:72px}.hd h2{font-size:1.1rem}
.dt .box[style*="margin-top:30px"]{margin-top:0!important}
.big .plate{width:68px;height:68px}
.row .gb{flex:1}
.prog div{font-size:.64rem}
.bar{gap:8px}.bar select{flex:1;min-width:0}
.sg{grid-template-columns:1fr}
.gc{padding:18px 12px}
#toast{bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);text-align:center}
}
@media(max-width:360px){.g4{grid-template-columns:1fr}.tabs button{font-size:.68rem}}
